<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanças da Família</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#182033;--muted:#6b7280;--line:#e5e7eb;--blue:#3659e3;--nav:#111827;--red:#c9364f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:22px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#94a3b8;font-size:12px;font-weight:500;margin-top:6px}.nav{display:grid;gap:7px;margin-top:24px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#263244;color:#fff}.main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:26px;font-weight:800;margin-top:5px}.hero{background:#172033;color:#fff}.hero .label{color:#cbd5e1}.section{display:none}.section.active{display:block}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 0 10px}.head h2{margin:0;font-size:19px}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafafa}.months{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px}.month{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.month b{font-size:12px}.month div{font-size:11px;color:var(--muted);margin-top:5px}.month strong{display:block;margin-top:7px}.pos{color:var(--blue)}.neg{color:var(--red)}.login{max-width:420px;margin:9vh auto}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:9px;width:100%}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.box{background:#fff;border-radius:16px;padding:20px;width:min(720px,100%);max-height:90vh;overflow:auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.months{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.main{padding:14px}.grid{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="loginView" class="login card"><h1>Finanças da Família</h1><p class="sub">Entre para acessar o planejamento financeiro familiar.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="password" type="password"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="signIn()">Entrar</button><button class="btn" style="width:100%;margin-top:8px" onclick="signUp()">Criar primeiro acesso</button><button id="resendBtn" class="btn hidden" style="width:100%;margin-top:8px" onclick="resendConfirmation()">Reenviar e-mail de confirmação</button><p id="authMsg" class="sub"></p></div>
<div id="appView" class="app hidden"><aside class="side"><div class="brand">Finanças da Família<small>Nov/26 → Dez/27</small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Visão geral</h1><div class="sub">Planejamento e projeção da família</div></div><button class="btn" onclick="signOut()">Sair</button></div><section id="dashboard" class="section active"></section><section id="cards" class="section"></section><section id="fixed" class="section"></section><section id="variable" class="section"></section><section id="income" class="section"></section><section id="debts" class="section"></section><section id="projection" class="section"></section></main></div>
<div id="modal" class="modal"><div class="box"><div id="modalContent"></div></div></div>
<script>
const sb=supabase.createClient('https://fafrrozjzjucbbbitfrr.supabase.co','sb_publishable_2rmoOvGT-Uw0YHHGp9eazQ_WVGQcQeG');
const START='2026-11',END='2027-12',months=[];for(let d=new Date(2026,10,1);d<=new Date(2027,11,1);d.setMonth(d.getMonth()+1))months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));const ml=m=>{let[y,x]=m.split('-');return new Date(+y,+x-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})};
let user=null,data={settings:{cash:0},cards:[],fixed:[],variable:[],income:[],debts:[]};const navs=[['dashboard','Visão geral'],['cards','Cartão'],['fixed','Gastos fixos'],['variable','Gastos variáveis'],['income','Caixa & receitas'],['debts','Dívidas'],['projection','Projeção mensal']];
function renderNav(){nav.innerHTML=navs.map((x,i)=>'<button class="'+(i?'':'active')+'" onclick="go(\''+x[0]+'\',this)">'+x[1]+'</button>').join('')}function go(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=navs.find(x=>x[0]===id)[1];render()}
function addMonth(m,n){let[y,x]=m.split('-').map(Number),d=new Date(y,x-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function cardRows(){let a=[];data.cards.forEach(c=>{for(let i=0;i<c.installments;i++){let m=addMonth(c.first_month,i);if(m>=START&&m<=END)a.push({...c,month:m,installment:i+1,value:Number(c.total)/c.installments})}});return a}const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);
function fixedAt(m){return sum(data.fixed.filter(x=>x.start_month<=m&&(!x.end_month||x.end_month>=m)),'amount')}function variableAt(m){return sum(data.variable.filter(x=>x.month===m),'amount')}function incomeAt(m){return sum(data.income.filter(x=>x.month===m),'amount')}function debtAt(m){return sum(data.debts.filter(x=>x.due_month===m&&!x.paid),'amount')}function cardsAt(m){return cardRows().filter(x=>x.month===m).reduce((s,x)=>s+x.value,0)}function monthly(m){let inc=incomeAt(m),fix=fixedAt(m),car=cardsAt(m),vari=variableAt(m),debt=debtAt(m);return{inc,fix,car,vari,debt,out:fix+car+vari+debt,net:inc-fix-car-vari-debt}}function proj(){let cash=Number(data.settings.cash||0);return months.map(m=>{let x=monthly(m);cash+=x.net;return{month:m,...x,cash}})}
function h(t,d,fn,label='Adicionar'){return '<div class="head"><div><h2>'+t+'</h2><div class="sub">'+d+'</div></div><button class="btn primary" onclick="'+fn+'">+ '+label+'</button></div>'}function act(t,id){return '<button class="btn" onclick="editItem(\''+t+'\',\''+id+'\')">Editar</button> <button class="btn danger" onclick="removeItem(\''+t+'\',\''+id+'\')">Excluir</button>'}function table(t,heads,arr,map){return '<div class="table"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'<th></th></tr></thead><tbody>'+(arr.map(x=>'<tr>'+map(x).map(v=>'<td>'+v+'</td>').join('')+'<td>'+act(t,x.id)+'</td></tr>').join('')||'<tr><td colspan="'+(heads.length+1)+'">Nenhum item cadastrado.</td></tr>')+'</tbody></table></div>'}
function render(){let p=proj(),avg=months.slice(0,3).map(m=>monthly(m).out).reduce((a,b)=>a+b,0)/3,run=avg?Number(data.settings.cash||0)/avg:0;dashboard.innerHTML='<div class="grid"><div class="card metric hero"><div class="label">Caixa atual</div><div class="value">'+money(data.settings.cash)+'</div></div><div class="card metric"><div class="label">Cobertura estimada</div><div class="value">'+run.toFixed(1)+' meses</div></div><div class="card metric"><div class="label">A receber</div><div class="value pos">'+money(sum(data.income,'amount'))+'</div></div><div class="card metric"><div class="label">Dívidas abertas</div><div class="value neg">'+money(sum(data.debts.filter(x=>!x.paid),'amount'))+'</div></div></div><div class="head"><h2>Linha do tempo</h2></div><div class="months">'+p.map(x=>'<div class="month"><b>'+ml(x.month)+'</b><div>Entradas '+money(x.inc)+'</div><div>Saídas '+money(x.out)+'</div><strong class="'+(x.cash>=0?'pos':'neg')+'">'+money(x.cash)+'</strong></div>').join('')+'</div>';
let cr=cardRows();cards.innerHTML=h('Cartão','Compras parceladas são projetadas automaticamente.','openForm("cards")','Nova compra')+'<div class="table"><table><thead><tr><th>Compra</th><th>Total</th><th>Parcela</th><th>Mês</th><th>Valor</th><th></th></tr></thead><tbody>'+(cr.map(x=>'<tr><td>'+x.description+'</td><td>'+money(x.total)+'</td><td>'+x.installment+'/'+x.installments+'</td><td>'+ml(x.month)+'</td><td>'+money(x.value)+'</td><td>'+(x.installment===1?act('cards',x.id):'')+'</td></tr>').join('')||'<tr><td colspan="6">Nenhuma compra.</td></tr>')+'</tbody></table></div>';fixed.innerHTML=h('Gastos fixos','Recorrências mensais.','openForm("fixed")')+table('fixed',['Descrição','Valor','Início','Fim'],data.fixed,x=>[x.description,money(x.amount),ml(x.start_month),x.end_month?ml(x.end_month):'Contínuo']);variable.innerHTML=h('Gastos variáveis','Despesas pontuais por mês.','openForm("variable")')+table('variable',['Descrição','Valor','Mês'],data.variable,x=>[x.description,money(x.amount),ml(x.month)]);income.innerHTML='<div class="grid"><div class="card metric"><div class="label">Valor em caixa</div><div class="value">'+money(data.settings.cash)+'</div><button class="btn" onclick="editCash()">Editar caixa</button></div></div>'+h('Receitas','Salários, extras e outros valores.','openForm("income")','Nova receita')+table('income',['Descrição','Tipo','Valor','Mês'],data.income,x=>[x.description,({salary:'Salário',extra:'Extra',other:'Outro'}[x.kind]||x.kind),money(x.amount),ml(x.month)]);debts.innerHTML=h('Dívidas','Compromissos previstos.','openForm("debts")','Nova dívida')+table('debts',['Descrição','Valor','Mês','Status'],data.debts,x=>[x.description,money(x.amount),ml(x.due_month),x.paid?'Pago':'Em aberto']);projection.innerHTML='<div class="head"><h2>Projeção mensal</h2></div><div class="table"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Fixos</th><th>Cartão</th><th>Variáveis</th><th>Dívidas</th><th>Saldo</th><th>Caixa</th></tr></thead><tbody>'+p.map(x=>'<tr><td>'+ml(x.month)+'</td><td>'+money(x.inc)+'</td><td>'+money(x.fix)+'</td><td>'+money(x.car)+'</td><td>'+money(x.vari)+'</td><td>'+money(x.debt)+'</td><td>'+money(x.net)+'</td><td>'+money(x.cash)+'</td></tr>').join('')+'</tbody></table></div>'}
function opts(sel){return months.map(m=>'<option value="'+m+'" '+(m===sel?'selected':'')+'>'+ml(m)+'</option>').join('')}function fld(n,l,v='',type='text'){return '<div class="field"><label>'+l+'</label><input name="'+n+'" type="'+type+'" value="'+(v??'')+'" '+(type==='number'?'step="0.01" min="0"':'')+' required></div>'}function mon(n,l,v,optional=false){return '<div class="field"><label>'+l+'</label><select name="'+n+'" '+(optional?'':'required')+'>'+(optional?'<option value="">Contínuo</option>':'')+opts(v)+'</select></div>'}function sel(n,l,o,v){return '<div class="field"><label>'+l+'</label><select name="'+n+'">'+o.map(x=>'<option value="'+x[0]+'" '+(x[0]===v?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'}
function openForm(t,item={}){let f='';if(t==='cards')f=fld('description','Descrição',item.description)+fld('total','Valor total',item.total,'number')+sel('installments','Pagamento',Array.from({length:24},(_,i)=>[String(i+1),i?(i+1)+'x':'À vista / 1x']),String(item.installments||1))+mon('first_month','Primeira fatura',item.first_month||START);if(t==='fixed')f=fld('description','Descrição',item.description)+fld('amount','Valor mensal',item.amount,'number')+mon('start_month','Começa em',item.start_month||START)+mon('end_month','Termina em',item.end_month||'',true);if(t==='variable')f=fld('description','Descrição',item.description)+fld('amount','Valor',item.amount,'number')+mon('month','Mês',item.month||START);if(t==='income')f=fld('description','Descrição',item.description)+sel('kind','Tipo',[['salary','Salário'],['extra','Extra'],['other','Outro']],item.kind||'salary')+fld('amount','Valor',item.amount,'number')+mon('month','Mês',item.month||START);if(t==='debts')f=fld('description','Descrição',item.description)+fld('amount','Valor',item.amount,'number')+mon('due_month','Mês',item.due_month||START)+sel('paid','Status',[['false','Em aberto'],['true','Pago']],String(!!item.paid));modalContent.innerHTML='<h3>'+(item.id?'Editar':'Adicionar')+'</h3><form class="form" onsubmit="save(event,\''+t+'\',\''+(item.id||'')+'\')">'+f+'<div style="grid-column:1/-1;text-align:right"><button type="button" class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary">Salvar</button></div></form>';modal.classList.add('show')}
function closeM(){modal.classList.remove('show')}function editItem(t,id){openForm(t,data[t].find(x=>x.id===id))}async function save(e,t,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(o.total)o.total=Number(o.total);if(o.amount)o.amount=Number(o.amount);if(o.installments)o.installments=Number(o.installments);if('paid'in o)o.paid=o.paid==='true';o.user_id=user.id;let q=id?sb.from(t).update(o).eq('id',id):sb.from(t).insert(o);let{error}=await q;if(error)return alert(error.message);closeM();await load();render()}async function removeItem(t,id){if(!confirm('Excluir este item?'))return;let{error}=await sb.from(t).delete().eq('id',id);if(error)return alert(error.message);await load();render()}
function editCash(){modalContent.innerHTML='<h3>Valor em caixa</h3><form onsubmit="saveCash(event)">'+fld('cash','Saldo disponível',data.settings.cash,'number')+'<div style="text-align:right;margin-top:12px"><button type="button" class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary">Salvar</button></div></form>';modal.classList.add('show')}async function saveCash(e){e.preventDefault();let cash=Number(new FormData(e.target).get('cash'));let{error}=await sb.from('settings').upsert({user_id:user.id,cash});if(error)return alert(error.message);closeM();await load();render()}
async function load(){for(const t of ['cards','fixed','variable','income','debts']){let{data:r,error}=await sb.from(t).select('*').order('created_at');data[t]=error?[]:r||[]}let{data:s}=await sb.from('settings').select('*').maybeSingle();data.settings=s||{cash:0}}function validateCredentials(){const e=email.value.trim(),p=password.value;if(!e){authMsg.textContent='Digite seu e-mail.';email.focus();return null}if(!p){authMsg.textContent='Digite uma senha.';password.focus();return null}if(p.length<6){authMsg.textContent='A senha precisa ter pelo menos 6 caracteres.';password.focus();return null}return{email:e,password:p}}
async function signIn(){const cred=validateCredentials();if(!cred)return;authMsg.textContent='Entrando...';resendBtn.classList.add('hidden');let{data:r,error}=await sb.auth.signInWithPassword(cred);if(error){if(error.message==='Email not confirmed'){authMsg.textContent='Seu e-mail ainda não foi confirmado. Abra o e-mail enviado pelo sistema e clique no link de confirmação.';resendBtn.classList.remove('hidden')}else authMsg.textContent='Não foi possível entrar: '+error.message;return}user=r.user;boot()}
async function signUp(){const cred=validateCredentials();if(!cred)return;authMsg.textContent='Criando acesso...';resendBtn.classList.add('hidden');let{data:r,error}=await sb.auth.signUp(cred);if(error){authMsg.textContent=error.message==='Anonymous sign-ins are disabled'?'Preencha e-mail e senha para criar seu acesso.':'Não foi possível criar o acesso: '+error.message;return}authMsg.textContent=r.session?'Acesso criado e login realizado.':'Cadastro criado. Verifique seu e-mail para confirmar o acesso.';if(!r.session)resendBtn.classList.remove('hidden');if(r.session){user=r.user;boot()}}
async function resendConfirmation(){const e=email.value.trim();if(!e){authMsg.textContent='Digite seu e-mail para reenviar a confirmação.';email.focus();return}authMsg.textContent='Reenviando e-mail de confirmação...';const{error}=await sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:window.location.origin+window.location.pathname}});if(error){authMsg.textContent='Não foi possível reenviar agora: '+error.message;return}authMsg.textContent='E-mail de confirmação reenviado. Verifique sua caixa de entrada e o spam.';resendBtn.classList.add('hidden')}async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){loginView.classList.add('hidden');appView.classList.remove('hidden');renderNav();await load();render()} (async()=>{let{data:{session}}=await sb.auth.getSession();if(session){user=session.user;boot()}})();
</script></body></html>
